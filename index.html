@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}

<script>
/* ============ state ============ */
const S = {
  db:null, user:null, downloads:null, canWrite:true, ready:false,
  view:"dashboard",
  settings:{}, drivers:{}, vehicles:{}, investors:{}, platforms:{}, importPlatform:"uber",
  ditems:{}, ledgerDriver:"", ledgerGroup:"week", ledger:null, terminals:{}, cardtx:[], reconDriver:"", posState:null, posQueue:[], posFilter:"", accounts:{}, acctView:"", customers:{}, suppliers:{}, coa:{}, payroll:{}, invpay:{}, loans:{}, rtalic:{}, rtadep:{}, fines:{}, rtablocks:{}, rtaplates:{}, reminders:{}, rcpt:{}, payouts:{}, feeinv:{}, pladj:{}, pltView:"", pltTab:"ledger", rtaTab:"lic", rtaEdit:null, loanView:"", loanEdit:null, invView:"", invTab:"trips", pdcs:{}, employees:{}, emppay:{}, drvAdj:{}, drvView:"", drvTab:"trips", coaView:"", ce:null, bk:null, pe:null, pv:null,
  trips:[], entries:[], entryDocs:{},
  from:null, to:null,
  importState:null, tripFilter:{q:"",driver:"",vehicle:"",platform:"",settle:""}, edit:null
};
const VIEWS = [
  ["Overview",null],["dashboard","Dashboard"],["trips","Trips"],["reminders","Reminders & expiries"],
  ["People & cars",null],["drivers","Drivers"],["vehicles","Vehicles"],["investors","Investors"],["platforms","Platforms & contracts"],["gps","GPS tracking"],
  ["Employees",null],["employees","Employees"],["emppayroll","Employee payroll"],
  ["Payment machines",null],["posupload","Upload statements"],["terminals","Machines"],
  ["RTA",null],["rta","RTA – licences, deposits & fines"],
  ["Accounts",null],["cashbank","Bank & cash accounts"],["receipts","Receipts"],["payments","Payments"],["transfers","Inter-account transfers"],["pdc","PDC cheques"],["bankfin","Bank finance"],["salesinv","Sales invoices"],["customers","Customers"],["entries","Purchases & expenses"],["suppliers","Suppliers"],["journals","Journal entries"],["coa","Chart of accounts"],["statements","Financial statements"],
  ["Money",null],["collections","Collections & cash"],["recon","Reconciliation"],["investorpl","Investor P&L"],["ledger","Ledger & VAT"],
  ["Documents",null],["offers","Driver offer letters"],["empoffers","Employee offer letters"],["agreements","Investor agreements"],
  ["Setup",null],["settings","Settings"]
];
/* Expense accounts for a limousine company. Cost of sales – vehicle running costs: 5200–5279 (and 5285 depreciation);
   drivers: 5100 / 5280. Administrative & general expenses: 5290–5310 and 6000+ (staff costs 6000–6030 come with the
   Employees module). */
const EXP_CATS = {
  "5200":"Fuel / EV charging","5210":"Salik / Darb tolls","5220":"RTA & traffic fines","5230":"Vehicle repairs and maintenance",
  "5240":"Vehicle insurance","5250":"Vehicle registration, passing and RTA cards","5255":"FMS vehicle trackers","5260":"Vehicle lease / rent",
  "5265":"Vehicle recovery charges","5270":"Parking & car wash",
  "5280":"Driver salaries & visas","5290":"Office & admin","5300":"Bank, WPS and POS charges","5310":"Miscellaneous and other expenses",
  "6100":"Office rent","6105":"General insurance (office, medical, liability)","6110":"Utilities and drinking water","6120":"Printing and stationery","6130":"Travelling and tickets",
  "6140":"Staff uniforms","6150":"Advertising and marketing","6160":"Software, subscriptions and web hosting","6170":"Office repairs, furniture and mobile phones",
  "6180":"Entertainment (office)","6190":"Fuel, wash and parking (office vehicles)","6200":"Cleaning and office consumables","6210":"Donation"
};
const ACCT = {
  "1100":"Bank","1110":"Cash in hand","1120":"Card machine receipts (not yet in bank)","1150":"Uber clearing (receivable)","1160":"Cash held by drivers","1170":"Driver loans & recoverables","1300":"Input VAT",
  "2100":"Driver accounts (payable / receivable)","2150":"Card receipts – terminal not assigned","2200":"Investor payables","2300":"Output VAT",
  "4000":"Ride fare revenue (platforms)","4010":"Toll & fee recoveries","4020":"Platform other earnings / incentives","4100":"Direct booking revenue","4210":"Deductions from drivers (violations)",
  "5000":"Platform service fee / commission","5010":"Non-recoverable VAT","5100":"Driver earnings share","5900":"Investor profit share",
  ...EXP_CATS
};
const ENTRY_TYPES = {
  expense:"Expense", income:"Direct booking income", uber_payout:"Platform payout received",
  driver_advance:"Advance to driver (deducted in full)", driver_payment:"Payment to driver", driver_receipt:"Received from driver (cash handover)",
  investor_payout:"Payout to investor", investor_receipt:"Received from investor", card_settlement:"Card machine settlement to bank", transfer:"Inter-account transfer"
};
const PAY_MODELS = {commission:"Commission % of net earnings", tiered:"Commission by slabs (monthly net earnings)", rent:"Rent per day (driver keeps rest)", salary:"Monthly salary", salary_comm:"Salary + commission %"};
/* commission by slabs on the driver's net earnings of each calendar month: the first slab at its %, the part between the
   two limits at the second %, the surplus above the second limit at the third % (defaults 23% up to 7,000 · 25% on
   7,000–10,000 · 30% above 10,000) */
const TIER_DEF = {tier1Upto: 7000, tier1Pct: 23, tier2Upto: 10000, tier2Pct: 25, tier3Pct: 30};
const tierOf = tm => Object.fromEntries(Object.entries(TIER_DEF).map(([k, v]) => [k, tm && tm[k] !== "" && tm[k] != null ? num(tm[k]) : v]));
function tierCalc(tm, N){ const T = tierOf(tm), u1 = T.tier1Upto, u2 = Math.max(u1, T.tier2Upto), parts = [];
  const add = (pct, base, label) => { if(base > 0.004) parts.push({pct, base: r2(base), amt: base * pct / 100, label}); };
  add(T.tier1Pct, Math.min(Math.max(N, 0), u1), "up to " + fmt(u1)); add(T.tier2Pct, Math.min(Math.max(N, 0), u2) - u1, fmt(u1) + " – " + fmt(u2)); add(T.tier3Pct, N - u2, "above " + fmt(u2));
  return {amt: parts.reduce((a, p) => a + p.amt, 0), parts}; }
// the driver's share of one AED of net earnings on a day (slabs: the month's average rate, set by compute())
S.tierRate = S.tierRate || {};
function shareRate(tm, dr, day){ const model = tm.payModel || "commission";
  if(model === "commission" || model === "salary_comm") return num(tm.commissionPct) / 100;
  if(model === "rent") return 1;
  if(model === "tiered"){ const k = dr + "|" + String(day || "").slice(0, 7); if(S.tierRate[k] != null) return S.tierRate[k];
    const N = (S.trips || []).filter(t => t.dr === dr && String(t.d).slice(0, 7) === k.split("|")[1]).reduce((a, t) => a + (t.f||0) - (t.sf||0) - (t.tx||0), 0);
    return N > 0 ? tierCalc(tm, N).amt / N : tierOf(tm).tier1Pct / 100; }
  return 0; }
const INV_MODELS = {profit_share:"% share of profit", mgmt_only:"Management fee only – the rest of the profit to the investor", fixed:"Fixed monthly payment", none:"Company-owned (no investor)"};
/* Platforms and other parties the company has a contract with. Trips carry pl (platform id);
   trips saved before platforms existed have none and count as Uber. Each platform has its own
   clearing (receivable) account, so what each one owes is tracked separately. */
const PLT_TYPES = {ride:"Ride-hailing platform", booking:"Booking / transfer platform", corporate:"Corporate client", supplier:"Supplier / partner"};
const PAY_CYCLES = {weekly:"Weekly", biweekly:"Every 2 weeks", monthly:"Monthly", per_trip:"Per trip / on invoice"};
const PLT_TERMS = ["commissionPct","feeVat","payCycle","creditDays"];
/* Driver accounts. Loans, salary advances and the driver's part of shared costs (visa, medical,
   licence…) are kept as items in driverItems and recovered in monthly instalments – on the last
   day of each month from the start month – until paid. A cash repayment shortens the plan.
   "Driver's cash" as paid-from means the driver paid a company cost, or collected company money,
   out of the cash he holds; it goes to his account instead of the bank. */
const ITEM_KINDS = {loan:"Loan", advance:"Salary advance", visa:"Visa", shared:"Other expense for the driver (medical, licence…)", other:"Other amount to recover"};
/* Cash and cash equivalents, as in Manager.io's Bank and Cash Accounts: bank accounts (1100–1109),
   cash accounts (1110–1119) and card network / merchant balances (1120–1129). 1100 Bank, 1110 Cash in
   hand and 1120 Card machine receipts always exist; more are added in the accounts collection (doc id =
   account code). Opening balances are as at the books start date (Settings). */
const CASH_TYPES = {bank:"Bank account", cash:"Cash account", network:"Card network / merchant balance", prepaid:"Prepaid account (Salik / fuel / EV)"};
const CASH_RANGE = {bank:1101, cash:1111, network:1121, prepaid:1131};
const DEFAULT_ACCTS = [{id:"1100", name:"Bank", type:"bank"}, {id:"1110", name:"Cash in hand", type:"cash"}, {id:"1120", name:"Card machine receipts", type:"network"}];
function cashAccounts(){
  const o = {}; DEFAULT_ACCTS.forEach(a => o[a.id] = {...a, isDefault:true});
  Object.values(S.accounts || {}).forEach(a => o[a.id] = {...(o[a.id] || {}), ...a});
  return Object.values(o).sort((a,b) => a.id.localeCompare(b.id));
}
const acctOpts = (types, withDriver) => ({...Object.fromEntries(cashAccounts().filter(a => a.active !== false && (!types || types.includes(a.type))).map(a => [a.id, a.name])), ...(withDriver ? {driver:"Driver's cash (driver paid / collected it)"} : {})});
const payAcct = pl => (S.platforms[pl] && S.platforms[pl].payoutAcct) || "1100";
const netAcct = tid => { const m = termByTid(tid); return (m && m.networkAcct) || "1120"; };

function parseTripDate(v){

/* ---------- one driver, many spellings ----------
   Uber: first name + surname ("Ahsan Khalid" + "Khalid"), Bolt: short name, Yango: other word order ("Siddique Saeed Ahmed"),
   RTA: full name with the father's name ("Ahsan Khalid Muhammad Khalid"). Two names are the same person when every word
   of the shorter is in the longer (any order, a one-letter slip allowed in long words: Coleman / Colemann), or the
   shorter written together starts the longer (Abu Bakkar / Abubakkar Sedeeq Abdullah). */
const nameWordsU = n => [...new Set(String(n || "").toLowerCase().replace(/[^a-z ]/g, " ").split(/\s+/).filter(w => w.length > 1))];
function oneSlip(a, b){ if(Math.abs(a.length - b.length) > 1) return false; let i = 0, j = 0, d = 0; while(i < a.length && j < b.length){ if(a[i] === b[j]){ i++; j++; continue; } if(++d > 1) return false; if(a.length > b.length) i++; else if(b.length > a.length) j++; else { i++; j++; } } return d + (a.length - i) + (b.length - j) <= 1; }

const NOT_A_PERSON = /\b(llc|l l c|limousine|transport|company|unnamed)\b/i;
function sameName(a, b){
  if(NOT_A_PERSON.test(a) || NOT_A_PERSON.test(b)) return false;
  let x = nameWordsU(a), y = nameWordsU(b); if(x.length > y.length) [x, y] = [y, x];
  if(x.length >= 2 && x.every(w => y.some(v => wordEq(w, v)))) return true;
  const xj = x.join(""), yj = y.join(""); return x.length >= 2 && xj.length >= 8 && yj.startsWith(xj) && y.length > x.length;
}

function matchDriver(name, pl){
  if(!name) return ""; const n = norm(name), D = Object.values(S.drivers);
  const ex = D.find(d => norm(d.name) === n || (d.aliases || []).some(x => norm(x) === n)); if(ex) return ex.id;   // a merged spelling stays known
  const linked = d => pl === "uber" ? !!d.uberUuid : !!(pl && (d.platformIds || {})[pl]);
  let c = D.filter(d => !linked(d) && sameName(name, d.name));
  if(c.length > 1){ const f = nameWordsU(name)[0]; c = c.filter(d => nameWordsU(d.name)[0] === f); }
  return c.length === 1 ? c[0].id : "";

    const memo = `${ITEM_KINDS[it.kind] || "Loan"} – ${dName(it.driverId)}${it.desc ? " – " + it.desc : ""}`, da = num(it.driverAmount);
    if(it.date >= S.from && it.date <= S.to){
      day = it.date;
      // the driver's share goes to 1170 (recovered through his salary); any part the company bears is an expense
      const amt = num(it.amount) || (it.kind === "shared" ? 0 : da), vat = num(it.vat), co = r2((inVatRec ? amt : amt + vat) - da);
      if(co) add(it.category || "5280", co, 0, memo); if(inVatRec) add("1300", vat, 0, memo); add("1170", da, 0, memo); add(srcAcct(it.paidFrom), 0, amt + vat, memo);
      day = null;
    }
    const p = itemPlan(it);
    p.inst.filter(x => x.date >= S.from && x.date <= S.to).forEach(x => { add("2100", x.amt, 0, "Instalment – " + memo, x.date); add("1170", 0, x.amt, "Instalment – " + memo, x.date); });
    p.reps.filter(x => x.date >= S.from && x.date <= S.to).forEach(x => { add(srcAcct(x.paidTo), num(x.amount), 0, "Repayment – " + memo, x.date); add("1170", 0, num(x.amount), "Repayment – " + memo, x.date); });
  }
  add.src = null; if(window.EMP) EMP.post(add);   // employee payroll runs
  add.src = null; if(window.FIN) FIN.post(add);   // vehicle purchases and finance instalments
  add.src = null; if(window.LOANS) LOANS.post(add);   // other bank loans and facilities
  add.src = null; if(window.RTA) RTA.post(add);   // RTA deposits and unpaid fines
  add.src = null; if(window.PLT) PLT.post(add);   // platform payouts matched with the bank
  add.src = null;
  // deductions from drivers' salaries for violations
  Object.values(S.drvAdj || {}).forEach(a => { if(a.kind !== "penalty" || a.date < S.from || a.date > S.to) return; const m = `Violation deduction – ${dName(a.driverId)}${a.reason ? " – " + a.reason : ""}`; add("2100", num(a.amount), 0, m, a.date); add("4210", 0, num(a.amount), m, a.date); });
  return L;
}

function handleFiles(files){
  const list = [...files].filter(f => /\.(csv|xlsx|xls)$/i.test(f.name) || f.type.includes("csv")); if(!list.length){ toast("Choose the trips / earnings file (CSV or Excel) exported from the platform."); return; }
  S.importQueue = []; let done = 0; const pl = S.importPlatform || "uber";
  // Excel files are read with SheetJS into the same rows as a CSV (first sheet, first row = headers)
  const parse = (file, cb) => { if(!/\.xlsx?$/i.test(file.name)) return Papa.parse(file, {header:true, skipEmptyLines:true, transformHeader: h => h.replace(/^\ufeff/,""), complete: cb, error: () => toast(`Couldn't read ${file.name}.`)});
    if(!window.XLSX){ toast("The Excel tool is still loading – try again in a moment."); return; }
    file.arrayBuffer().then(buf => { const wb = XLSX.read(buf, {type: "array", cellDates: true}), data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval: "", raw: false, dateNF: "yyyy-mm-dd hh:mm:ss"}); cb({data, meta: {fields: Object.keys(data[0] || {})}}); }).catch(() => toast(`Couldn't read ${file.name}.`)); };
  list.forEach(file => parse(file, res => {
    // only Uber has the separate Trip activity report; other platforms' files are read as money rows
    const headers = res.meta.fields || [], kind = pl === POS ? "pos" : pl === "uber" ? UberParse.detect(headers) : "payments", sig = (pl === "uber" ? "" : pl + "|") + headers.join("|");
    const saved = kind !== "activity" ? (S.settings.mappings||{})[norm(sig).slice(0,180)] : null;
    S.importQueue.push({kind, pl, rows: res.data, headers, files:[file.name], map: kind === "payments" ? (saved || guessMap(headers)) : kind === "pos" ? (saved || guessPos(headers)) : null, fileTid:"", sig, paid: UberParse.paidToYou(res.data, headers)});
    if(++done === list.length){

      S.importQueue.sort((a,b) => (a.kind === "activity" ? 0 : 1) - (b.kind === "activity" ? 0 : 1));
      S.importState = S.importQueue.shift(); render();
    }}));
}

function vehLedger(vid){

  const fareStd = setting("fareVat","exempt") === "standard", feeVatRec = setting("feeVatRecoverable", false), inVatRec = setting("inputVatRecoverable", false);
  const n = {}; S.trips.forEach(t => { if((t.tr || t.f) && vehicleForTrip(t) === vid) n[t.d] = (n[t.d] || 0) + 1; });

    if(r2(g.fee)) L.push({date:k, desc:`Platform fee · ${per}`, dr:g.fee});
    if(!feeVatRec && r2(g.tax)) L.push({date:k, desc:`VAT on platform fee · ${per}`, dr:g.tax});
    if(r2(g.ref)) L.push({date:k, desc:`Refunds & tolls recovered · ${per}`, cr:g.ref});
    if(r2(g.drv) > 0) L.push({date:k, desc:`Driver cost (earnings share / salary) · ${per}`, dr:g.drv});
    else if(r2(g.drv) < 0) L.push({date:k, desc:`Rent from driver · ${per}`, cr:-g.drv}); });

/* ---------- driver ledger & loans ---------- */
/* A running account per driver from the ledger start date: earnings share, tips and cash collected
   from trips, plus advances, payments, charges and loan instalments. Positive balance = the company
   owes the driver. Loans are shown separately: they move into the account as instalments fall due. */
// S.No of each trip in the period: oldest first, the rows of one trip share its number (the GPS audit refers to it)
function numberTrips(trips){ const seen = {}; let n = 0; trips.filter(t => t.tr || t.f).slice().sort((a, b) => (a.d + (a.ts || a.t || "")).localeCompare(b.d + (b.ts || b.t || ""))).forEach(t => { const k = t.tr || t.id; t.no = seen[k] ||= ++n; }); }
// trip details from the Trip activity report (car, km, status, start / end) onto the trips
function mergeInfo(trips, info){ trips.forEach(t => { const i = t.tr && info[t.tr]; if(i){ t.p = t.p || i.p; t.km = t.km || i.km; t.st = i.st; t.prod = i.prod; t.pay = i.pay; if(i.t) t.ts = i.t; if(i.te) t.te = t.te || i.te; } }); }
async function loadLedger(){
  const start = setting("ledgerStart", "2026-09-01"), to = S.to, key = start + "|" + to;
  S.ledger = {key, loading:true};
  try{
    const trips = [], ents = [];
    if(start <= to){
      const ts = await S.db.collection("trips").where("date",">=",start).where("date","<=",to).get();
      ts.docs.forEach(d => Object.entries((d.data()||{}).rows || {}).forEach(([id,r]) => trips.push({id, ...r})));
      // without it the Uber trips of the history have no car – Salik / fines could not find their driver
      const is = await S.db.collection("tripinfo").where("date",">=",addDays(start,-1)).where("date","<=",addDays(to,1)).get(), info = {};
      is.docs.forEach(d => Object.entries((d.data()||{}).rows || {}).forEach(([tr,r]) => { info[tr] = r; })); mergeInfo(trips, info);
      for(const m of months(start, to)){ const d = await S.db.doc("entries/"+m).get(); (d.exists ? (d.data().rows || []) : []).forEach(r => { if(r.date >= start && r.date <= to) ents.push(r); }); }
    }
    const cards = [];
    if(start <= to){ const cs = await S.db.collection("cardtx").where("date",">=",start).where("date","<=",to).get(); cs.docs.forEach(d => Object.entries((d.data()||{}).rows || {}).forEach(([id,r]) => cards.push({id, ...r}))); }
    if(window.PUR) ents.push(...PUR.expand(ents));
    if(S.ledger && S.ledger.key === key) S.ledger = {key, trips, entries: ents, cards};
  }catch(e){ console.warn(e); S.ledger = {key, error:true}; }
  render();
}
function ledgerLines(drId){
  const L = S.ledger, start = setting("ledgerStart", "2026-09-01"), tips2drv = setting("tipsToDriver", true);
  const keep = {trips:S.trips, entries:S.entries, from:S.from, cardtx:S.cardtx};
  S.trips = L.trips; S.entries = L.entries; S.from = start; S.cardtx = L.cards || [];
  let C; try{ C = compute(); } finally { S.trips = keep.trips; S.entries = keep.entries; S.from = keep.from; S.cardtx = keep.cardtx; }
  const d = C.D[drId] || {byDay:{}}, lines = [], G = {};
  const gk = day => { let k = S.ledgerGroup === "day" ? day : S.ledgerGroup === "month" ? monthEnd(day.slice(0,7)) : weekEnd(day);
    if(day < S.from && k >= S.from) k = addDays(S.from, -1); if(k > S.to) k = S.to; return k; };
  Object.entries(d.byDay).forEach(([day, b]) => { const g = G[gk(day)] ||= {share:0, tip:0, cash:0, n:0, card:0, a:day, z:day}; g.card += b.card || 0; g.share += b.share; g.tip += b.tip; g.cash += b.cash; g.n += b.n; if(day < g.a) g.a = day; if(day > g.z) g.z = day; });
  Object.entries(G).forEach(([k, g]) => { const per = g.a === g.z ? dmyS(g.a) : dmyS(g.a) + " – " + dmyS(g.z);
    if(r2(g.share)) lines.push({date:k, desc:`${g.share >= 0 ? "Earnings share" : "Rent / charges over earnings"} · ${g.n} trips · ${per}`, ...(g.share >= 0 ? {cr:g.share} : {dr:-g.share})});
    if(tips2drv && r2(g.tip)) lines.push({date:k, desc:`Tips · ${per}`, cr:g.tip});
    if(r2(g.card)) lines.push({date:k, desc:`Card payments on company terminal · ${per}`, cr:g.card});
    if(r2(g.cash)) lines.push({date:k, desc:`Cash collected from riders · ${per}`, dr:g.cash}); });
  L.entries.filter(e => e.driverId === drId).forEach(e => {
    const a = num(e.amount) + (e.type === "expense" || e.type === "income" ? num(e.vat) : 0), n = e.note ? " – " + e.note : "", cat = EXP_CATS[e.category] || "Expense";
    if(e.type === "driver_advance") lines.push({date:e.date, desc:"Advance" + n, dr:a});
    else if(e.type === "driver_payment") lines.push({date:e.date, desc:"Payment to driver" + n, dr:a});
    else if(e.type === "driver_receipt") lines.push({date:e.date, desc:"Received from driver" + n, cr:a});
    else if(e.type === "expense"){ if(e.recover) lines.push({date:e.date, desc:cat + " charged to driver" + n, dr:a}); if(e.paidFrom === "driver") lines.push({date:e.date, desc:cat + " paid from driver's cash" + n, cr:a}); }
    else if(e.type === "income" && e.paidFrom === "driver") lines.push({date:e.date, desc:"Direct booking – cash collected by driver" + n, dr:a});
  });
  if(window.BOOKS) BOOKS.driverLines(L.entries, drId).forEach(l => lines.push(l));
  Object.values(S.ditems).filter(it => it.driverId === drId).forEach(it => itemPlan(it).inst.forEach(x => { if(x.date >= start && x.date <= S.to) lines.push({date:x.date, desc:`Instalment – ${ITEM_KINDS[it.kind] || "Loan"}${it.desc ? " – " + it.desc : ""}`, dr:x.amt}); }));
  lines.sort((a,b) => a.date.localeCompare(b.date) || (b.cr ? 1 : 0) - (a.cr ? 1 : 0));
  const open = num((S.drivers[drId] || {}).openingBalance); let bal = open, before = open; const shown = [];
  lines.forEach(l => { bal = r2(bal + (l.cr || 0) - (l.dr || 0)); l.bal = bal; if(l.date < S.from) before = bal; else shown.push(l); });
  return {open, before, shown, closing: bal};

/* ---------- payment machine statements ---------- */
/* Statements from any provider (Network International, Magnati, Geidea…), as CSV or Excel. Bank files
   often start with title lines, so the header row is found first. Each payment is linked to its machine
   by the terminal number (TID), and through the machine to the driver who held it that day. */
const cellText = v => v instanceof Date ? iso(v) + " " + String(v.getHours()).padStart(2,"0") + ":" + String(v.getMinutes()).padStart(2,"0") : (v ?? "");
function tableFromRows(arr){
  const filled = r => (r || []).filter(c => String(c ?? "").trim()).length;
  let hi = arr.findIndex(r => filled(r) >= 3 && r.some(c => /terminal|tid|amount/i.test(String(c))));
  if(hi < 0) hi = arr.findIndex(r => filled(r) >= 3);
  if(hi < 0) return {headers:[], rows:[]};
  const seen = {}, headers = arr[hi].map((h,i) => { let k = String(h ?? "").trim() || "Column " + (i+1); if(seen[k]) k += " (" + (++seen[k]) + ")"; else seen[k] = 1; return k; });
  const rows = arr.slice(hi+1).filter(r => filled(r)).map(r => Object.fromEntries(headers.map((h,i) => [h, cellText(r[i])])));
  return {headers, rows};
}
async function readPosFiles(files){
  const list = [...files].filter(f => /\.(csv|xlsx|xls)$/i.test(f.name)); if(!list.length){ toast("Choose the statement as a CSV or Excel file."); return; }
  S.posQueue = [];
  for(const f of list){
    let tables = [];
    try{
      if(/\.csv$/i.test(f.name)){ const t = await f.text(); tables = [Papa.parse(t.charCodeAt(0) === 0xFEFF ? t.slice(1) : t, {skipEmptyLines:true}).data]; }
      else { if(!window.XLSX){ toast("The Excel reader didn't load. Check the internet connection, or save the file as CSV."); return; }
        const wb = XLSX.read(await f.arrayBuffer(), {type:"array", cellDates:true}); tables = wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:""})); }
    }catch(e){ console.warn(e); toast(`Couldn't read ${f.name}.`); continue; }
    const tb = tables.map(tableFromRows).find(x => x.headers.length && x.rows.length);
    if(!tb){ toast(`${f.name}: no table of payments found.`); continue; }
    const sig = POS + "|" + tb.headers.join("|"), saved = (S.settings.mappings||{})[norm(sig).slice(0,180)];
    S.posQueue.push({kind:"pos", rows: tb.rows, headers: tb.headers, files:[f.name], map: saved || guessPos(tb.headers), fileTid:"", sig});
  }
  S.posState = S.posQueue.shift() || null; render();
}

    ${(() => { tx.forEach(x => { run = r2(run + x.amt); x._run = run; }); const pg = paged("mtx-" + id, tx.slice().reverse()); tx._bar = pg.bar; return pg.rows; })().map(x => { const dr = cardDriver(x); return `<tr><td>${esc(dmyS(x.d))}</td><td>${esc(x.t)}</td><td>${dr ? esc(dName(dr)) : '<span class="pill warn">Not assigned</span>'}</td><td class="mono small">${esc(x.card)}</td><td class="num">${aed(x.amt)}</td><td class="num">${fmt(x.fee)}</td><td class="num">${aed(x.amt - x.fee)}</td><td class="num">${aed(x._run)}</td><td class="mono small">${esc(x.ref)}</td><td class="small muted">${esc(x.file || "")}</td></tr>`; }).join("") || `<tr><td colspan="10" class="muted">No payments on this machine in the period.</td></tr>`}
    </tbody><tfoot><tr><td colspan="4">Total</td><td class="num">${fmt(sum(tx, x => x.amt))}</td><td class="num">${fmt(sum(tx, x => x.fee))}</td><td class="num">${fmt(sum(tx, x => x.amt - x.fee))}</td><td colspan="3"></td></tr></tfoot></table></div>${tx._bar || ""}`;
  }
  return `<div class="section"><div class="head"><div><h2>${esc(tm.name || "Machine")} <span class="mono small muted">TID ${esc(tm.tid)}</span></h2><p class="sub">Driver now: <b>${cur ? esc(dName(cur)) : "none"}</b>${tm.provider ? " · " + esc(tm.provider) : ""} · payments go to ${esc(acctName(tm.networkAcct || "1120"))}</p></div>

/* ---------- reconciliation ---------- *//* ---------- reconciliation ---------- */
/* Per driver: Total payment = Payout from application + Card payment + Cash from driver + Difference.
   Total payment = what riders paid for the driver's trips (fares, tips, tolls) plus direct bookings he
   collected. Payout from application = the part paid in the app, which the platform pays to the company.
   Card = payments on the company terminal he held. Cash from driver = cash he handed over or spent on
   company costs. The difference is cash still with the driver (or a shortage to follow up). */
function reconRows(){
  const C = compute();
  return Object.values(C.D).map(d => { const mine = S.entries.filter(e => e.driverId === d.id);
    const inc = sum(mine.filter(e => e.type === "income" && e.paidFrom === "driver"), e => num(e.amount)+num(e.vat)), exp = sum(mine.filter(e => e.type === "expense" && e.paidFrom === "driver"), e => num(e.amount)+num(e.vat));
    const total = d.fare + d.tip + d.ref + inc, app = d.fare + d.tip + d.ref - d.cash, card = d.card || 0, handed = d.recv + exp;
    return {id:d.id, n:d.n, total, app, cashTrips: d.cash + inc, card, handed, diff: r2(total - app - card - handed)}; })
    .filter(r => r.total || r.card || r.handed).sort((a,b) => Math.abs(b.diff) - Math.abs(a.diff));
}
function vRecon(){
  const R = reconRows(), unas = (S.cardtx || []).filter(x => !cardDriver(x)), sel = S.reconDriver;
  const status = r => Math.abs(r.diff) < 0.5 ? '<span class="pill good">Reconciled</span>' : r.diff > 0 ? '<span class="pill warn">Cash still with driver</span>' : '<span class="pill bad">More than the trips</span>';
  let detail = "";
  if(sel){
    const D = {}, day = k => D[k] ||= {total:0, cash:0, card:0, handed:0, n:new Set()};
    S.trips.filter(t => t.dr === sel).forEach(t => { const b = day(t.d); b.total += (t.f||0) + (t.tp||0) + (t.rf||0); b.cash += t.c||0; if(t.tr || t.f) b.n.add(t.tr || t.id); });
    (S.cardtx || []).filter(x => cardDriver(x) === sel).forEach(x => day(x.d).card += x.amt);
    S.entries.filter(e => e.driverId === sel).forEach(e => { if(e.type === "driver_receipt") day(e.date).handed += num(e.amount); else if(e.paidFrom === "driver" && e.type === "expense") day(e.date).handed += num(e.amount) + num(e.vat); else if(e.paidFrom === "driver" && e.type === "income"){ const b = day(e.date); b.total += num(e.amount) + num(e.vat); b.cash += num(e.amount) + num(e.vat); } });
    let run = 0;
    detail = `<div class="section"><div class="head"><div><h2>${esc(dName(sel))} · day by day</h2><p class="sub">Cash to collect = cash trips that day. A day with more card payments than cash trips usually means the terminal was used for another driver or for a booking outside the platforms.</p></div><button class="btn ghost" data-recon="${esc(sel)}">Close</button></div>
    <div class="tbl"><table><thead><tr><th>Date</th><th class="num">Trips</th><th class="num">Total payment</th><th class="num">Payout from app</th><th class="num">Cash trips</th><th class="num">Card</th><th class="num">Cash handed / spent</th><th class="num">Difference</th><th class="num">Running</th><th></th></tr></thead><tbody>
    ${Object.keys(D).sort().map(k => { const b = D[k], diff = r2(b.cash - b.card - b.handed); run = r2(run + diff);
      return `<tr><td>${esc(dmyS(k))}</td><td class="num">${b.n.size}</td><td class="num">${fmt(b.total)}</td><td class="num">${fmt(b.total - b.cash)}</td><td class="num">${fmt(b.cash)}</td><td class="num">${fmt(b.card)}</td><td class="num">${fmt(b.handed)}</td><td class="num">${aed(diff)}</td><td class="num">${aed(run)}</td><td>${b.card > b.cash + 0.5 ? '<span class="pill bad">Card more than cash trips</span>' : ""}</td></tr>`; }).join("")}
    </tbody></table></div></div>`;
  }
  return `<div class="banner info"><b>Total payment = Payout from application + Card payment + Cash from driver + Difference.</b> Total payment is what riders paid for the driver's trips (plus direct bookings he collected). The difference is cash the driver still holds – it is deducted from his pay in the Driver settlement. A negative difference means card and cash are more than his trips: check the terminal assignment or record the booking.</div>
  ${unas.length ? `<div class="banner">${unas.length} card payments (AED ${fmt(sum(unas, x => x.amt))}) are on terminals with no driver assigned for that date: ${esc([...new Set(unas.map(x => x.tid))].join(", "))}. Assign them on the Machines page, with the date the machine was handed over.</div>` : ""}
  ${detail}
  <div class="section"><div class="head"><div><h2>Reconciliation · ${esc(dmyS(S.from))} to ${esc(dmyS(S.to))}</h2><p class="sub">Click a driver to see each day.</p></div>${fmtGroup('data-legacy="expRecon"')}</div>
  ${R.length ? `<div class="tbl"><table><thead><tr><th>Driver</th><th class="num">Trips</th><th class="num">Total payment</th><th class="num">Payout from application</th><th class="num">Card payment</th><th class="num">Cash from driver</th><th class="num">Difference</th><th></th></tr></thead><tbody>
  ${R.map(r => `<tr><td><button class="btn sm ghost" data-recon="${esc(r.id)}" style="padding:2px 6px">${esc(dName(r.id))}</button></td><td class="num">${r.n}</td><td class="num">${fmt(r.total)}</td><td class="num">${fmt(r.app)}</td><td class="num">${fmt(r.card)}</td><td class="num">${fmt(r.handed)}</td><td class="num"><b>${aed(r.diff)}</b></td><td>${status(r)}</td></tr>`).join("")}
  </tbody><tfoot><tr><td>Total</td><td class="num">${sum(R, r => r.n)}</td><td class="num">${fmt(sum(R, r => r.total))}</td><td class="num">${fmt(sum(R, r => r.app))}</td><td class="num">${fmt(sum(R, r => r.card))}</td><td class="num">${fmt(sum(R, r => r.handed))}</td><td class="num">${fmt(sum(R, r => r.diff))}</td><td></td></tr></tfoot></table></div>` : `<div class="empty"><b>Nothing to reconcile</b>Import trips and terminal statements for this period.</div>`}
  <p class="small muted" style="margin-top:8px">Cash from driver = “Received from driver” entries plus company costs he paid from his cash (Expenses & payments). Payout from application is what the platform collected; the platform pays it to the company after its fees – see Collections & cash.</p></div>`;
}

/* ---------- collections & cash ---------- */
/* Riders pay in three ways: in the app (card / wallet – the platform collects it and pays the company
   after its fees), cash to the driver (the driver keeps it; it is set off against his pay), or for direct
   bookings by card machine or bank transfer (into the company's account, card money a few days later). */
function vCollections(){
  const T = S.trips, by = {}, K = ["f","tp","rf","oe","sf","tx","c","po"];
  T.forEach(t => { const b = by[plOf(t)] ||= {f:0,tp:0,rf:0,oe:0,sf:0,tx:0,c:0,po:0,n:new Set(),cn:new Set()}; K.forEach(k => b[k] += t[k]||0); if(t.tr || t.f) b.n.add(t.tr||t.id); if(t.c) b.cn.add(t.tr||t.id); });
  const manual = pl => sum(S.entries.filter(e => e.type === "uber_payout" && (e.platformId || "uber") === pl), e => num(e.amount));
  // Uber's payment codes in plain words; everything except cash is paid in the app
  const PAY_LBL = {cash:"Cash to driver", braintree:"Card (in app)", apple_pay:"Apple Pay (in app)", google_pay:"Google Pay (in app)", paypal:"PayPal (in app)", digital:"Digital wallet (in app)"};
  const payLbl = v => { const k = String(v || "").toLowerCase(); return !k ? "Not known" : PAY_LBL[k] || "In app – " + k.replace(/_/g, " "); };
  const pays = {}; T.forEach(t => { if(!(t.tr || t.f)) return; const k = t.pay ? payLbl(t.pay) : t.c ? PAY_LBL.cash : "Not known"; const p = pays[k] ||= {n:new Set(), f:0, c:0}; p.n.add(t.tr||t.id); p.f += t.f||0; p.c += t.c||0; });
  const C = compute(), drs = Object.values(C.D).map(d => { const mine = S.entries.filter(e => e.driverId === d.id);
    const inc = sum(mine.filter(e => e.type === "income" && e.paidFrom === "driver"), e => num(e.amount)+num(e.vat)), exp = sum(mine.filter(e => e.type === "expense" && e.paidFrom === "driver"), e => num(e.amount)+num(e.vat));
    return {id:d.id, cash:d.cash, inc, exp, recv:d.recv, card:d.card, held: d.cash + inc - exp - d.recv - d.card}; }).filter(x => x.cash || x.inc || x.exp || x.recv || x.card).sort((a,b) => b.held - a.held);
  const cardIn = sum(S.entries.filter(e => e.type === "income" && e.paidFrom === "1120"), e => num(e.amount)+num(e.vat)) + sum(S.cardtx||[], x => x.amt), cardOut = sum(S.entries.filter(e => e.type === "card_settlement"), e => num(e.amount)) + sum(S.cardtx||[], x => x.fee);
  return `<div class="banner info">How riders pay: <b>in the app</b> (card / wallet) – the platform collects it and pays the company after its fees; <b>cash to the driver</b> – the driver keeps it and it is set off against his pay in the settlement; <b>direct bookings</b> – card machine or bank transfer into the company's account (record them under Expenses & payments as direct booking income, received into “Card machine” until the bank settles it).</div>
  <div class="section"><h2>What each platform owes</h2><p class="sub">${esc(dmyS(S.from))} to ${esc(dmyS(S.to))}. Collected in app = fares + tips + refunds − cash kept by drivers. Due = that + incentives − platform fee and VAT. Paid = transfers in the platform's report plus payouts entered by hand.</p>
  <div class="tbl"><table><thead><tr><th>Platform</th><th class="num">Trips</th><th class="num">Cash trips</th><th class="num">Collected in app</th><th class="num">Cash kept by drivers</th><th class="num">Fee + VAT</th><th class="num">Due to company</th><th class="num">Paid to bank</th><th class="num">Still due</th></tr></thead><tbody>
  ${Object.entries(by).map(([k,b]) => { const app = b.f + b.tp + b.rf - b.c, due = app + b.oe - b.sf - b.tx, paid = b.po + manual(k);
    return `<tr><td>${esc(pName(k))}</td><td class="num">${b.n.size}</td><td class="num">${b.cn.size}</td><td class="num">${fmt(app)}</td><td class="num">${fmt(b.c)}</td><td class="num">${fmt(b.sf + b.tx)}</td><td class="num">${fmt(due)}</td><td class="num">${fmt(paid)}</td><td class="num"><b>${aed(due - paid)}</b></td></tr>`; }).join("") || `<tr><td colspan="9" class="muted">No trips in this period.</td></tr>`}
  </tbody></table></div><p class="small muted" style="margin-top:6px">Uber's Payments report already contains the transfers to the bank, so don't also enter those Uber payouts by hand.</p></div>
  <div class="section"><h2>Trips by payment type</h2><p class="sub">From Uber's Trip activity report (other platforms: trips with cash count as cash).</p>
  <div class="tbl"><table><thead><tr><th>Payment type</th><th class="num">Trips</th><th class="num">Fares</th><th class="num">Cash collected</th></tr></thead><tbody>
  ${Object.entries(pays).sort((a,b) => b[1].n.size - a[1].n.size).map(([k,p]) => `<tr><td>${esc(k)}</td><td class="num">${p.n.size}</td><td class="num">${fmt(p.f)}</td><td class="num">${fmt(p.c)}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">No trips in this period.</td></tr>`}
  </tbody></table></div></div>
  <div class="section"><h2>Cash with drivers</h2><p class="sub">Cash the drivers collected this period and what happened to it. Whatever they still hold is deducted from their pay in the Driver settlement.</p>
  ${drs.length ? `<div class="tbl"><table><thead><tr><th>Driver</th><th class="num">Cash from riders</th><th class="num">Direct bookings collected</th><th class="num">Paid by card on terminal</th><th class="num">Company costs paid from it</th><th class="num">Handed over</th><th class="num">Still with driver</th></tr></thead><tbody>
  ${drs.map(x => `<tr><td>${esc(dName(x.id))}</td><td class="num">${fmt(x.cash)}</td><td class="num">${fmt(x.inc)}</td><td class="num">${fmt(x.card)}</td><td class="num">${fmt(x.exp)}</td><td class="num">${fmt(x.recv)}</td><td class="num"><b>${aed(x.held)}</b></td></tr>`).join("")}
  </tbody><tfoot><tr><td>Total</td><td class="num">${fmt(sum(drs,x=>x.cash))}</td><td class="num">${fmt(sum(drs,x=>x.inc))}</td><td class="num">${fmt(sum(drs,x=>x.card))}</td><td class="num">${fmt(sum(drs,x=>x.exp))}</td><td class="num">${fmt(sum(drs,x=>x.recv))}</td><td class="num">${fmt(sum(drs,x=>x.held))}</td></tr></tfoot></table></div>` : `<p class="sub">No cash collected by drivers in this period.</p>`}</div>
  ${cardIn || cardOut ? `<div class="section"><h2>Card machine</h2><p class="sub">Card payments (terminals and direct bookings): AED ${fmt(cardIn)}. Settled to the bank and card fees: AED ${fmt(cardOut)}. Not yet in the bank: <b class="mono">AED ${fmt(cardIn - cardOut)}</b>. Record each settlement as “Card machine settlement to bank”.</p></div>` : ""}`;
}

document.addEventListener("click", async ev => {
  const t = ev.target.closest("button,[data-nav]"); if(!t) return;

  if(t.hasAttribute("data-cancel")){ S.edit = null; voucherDone(); render(); return; }
  if(t.dataset.del){
    if(t.dataset.confirm !== "1"){ t.dataset.confirm = "1"; t.textContent = "Click again to delete"; return; }
    if(await writeOk(S.db.doc(t.dataset.del + "/" + t.dataset.id).delete())){ S.edit = null; toast("Deleted."); render(); } return;
  }
  if(t.dataset.termdel != null && t.dataset.col){

    const col = t.dataset.col, rec = S[col][t.dataset.id]; if(!rec) return;
    const field = t.dataset.field || "terms";

    if(await writeOk(S.db.doc(col + "/" + t.dataset.id).set({...body, ...pick(now, keys), [field]: hist}))){ toast("Entry removed."); render(); }
    return;
  }

  if(f.id === "fEntry"){
    const m = fd.date.slice(0,7); const oldId = f.dataset.id; const ref = S.db.doc("entries/"+m);
    if(oldId){ const old = S.entries.find(x=>x.id===oldId); if(old && old.date.slice(0,7) !== m){ const om = old.date.slice(0,7); const s0 = await S.db.doc("entries/"+om).get(); const r0 = (s0.exists ? s0.data().rows : []).filter(r=>r.id!==oldId); if(!await writeOk(S.db.doc("entries/"+om).set({month:om, rows:r0}))) return; } }
    const snap = await ref.get(); let rows = snap.exists ? (snap.data().rows||[]) : [];
    // keep what the form does not show (imported quantity, statement reference, fine link…)
    const prev = oldId ? (S.entries.find(x => x.id === oldId) || {}) : {};
    const row = {...prev, id: oldId || uid(), ...fd}; rows = rows.filter(r => r.id !== row.id); rows.push(row);
    if(await writeOk(ref.set({month:m, rows}))){ S.edit = null; await loadPeriod(); voucherDone(); render(); toast(oldId ? "Entry updated." : "Entry added."); }
  }
  if(f.id === "fSettings"){ if(await writeOk(S.db.doc("settings/main").set({...S.settings, ...fd}))) toast("Settings saved."); }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if(t.id === "tq"){ S.tripFilter.q = t.value; clearTimeout(S._q); S._q = setTimeout(render, 200); }
});
document.addEventListener("change", async ev => {
  const t = ev.target;
  if(t.id === "preset"){ if(t.value !== "custom"){ setPreset(t.value); await loadPeriod(); render(); } return; }
  if(t.id === "pFrom" || t.id === "pTo"){ $("#preset").value = "custom"; const a = $("#pFrom").value, b = $("#pTo").value; if(a && b && a <= b){ S.from = a; S.to = b; await loadPeriod(); render(); } return; }
  if(t.id === "tdrv"){ S.tripFilter.driver = t.value; render(); return; }
  if(t.id === "tveh"){ S.tripFilter.vehicle = t.value; render(); return; }
  if(t.id === "tset"){ S.tripFilter.settle = t.value; render(); return; }
  if(t.id === "tpl"){ S.tripFilter.platform = t.value; render(); return; }
  if(t.id === "ldrv"){ S.ledgerDriver = t.value; S.edit = null; render(); return; }
  if(t.id === "lgrp"){ S.ledgerGroup = t.value; render(); return; }
  if(t.id === "vgrp"){ S.vehGroup = t.value; render(); return; }
  if(t.id === "ik"){ return; }
  if(t.id === "impAdj" && S.importState){ S.importState.noAdj = !t.checked; return; }
  if(t.id === "impPl"){ S.importPlatform = t.value; S.importState = null; S.importQueue = []; render(); return; }
  if(t.id === "file"){ handleFiles(t.files); t.value = ""; return; }
  if(t.dataset.posmap && S.posState){ S.posState.map[t.dataset.posmap] = t.value; render(); return; }
  if(t.id === "posTid" && S.posState){ S.posState.fileTid = t.value.trim(); render(); return; }
  if(t.id === "posFile"){ readPosFiles(t.files); t.value = ""; return; }
  if(t.id === "posF"){ S.posFilter = t.value; render(); return; }
  if(t.dataset.map && S.importState){ S.importState.map[t.dataset.map] = [...t.selectedOptions].map(o=>o.value).filter(Boolean); render(); return; }
});
["dragenter","dragover"].forEach(n => document.addEventListener(n, ev => { const d = ev.target.closest && ev.target.closest("#drop, #posDrop"); if(d){ ev.preventDefault(); d.classList.add("over"); } }));
["dragleave","drop"].forEach(n => document.addEventListener(n, ev => { const d = ev.target.closest && ev.target.closest("#drop, #posDrop"); if(d){ ev.preventDefault(); d.classList.remove("over"); if(n === "drop") (d.id === "posDrop" ? readPosFiles : handleFiles)(ev.dataTransfer.files); } }));

/* ============ sign-in ============ */
function showLogin(msg){ $("#login").hidden = false; $("#lmsg").textContent = msg || ""; render(); }
function showUser(me){
  const w = $("#who"); w.hidden = false;
  w.innerHTML = `<span>${esc(me.name || me.id)}</span><button type="button" id="signout">Sign out</button>`;
}
document.addEventListener("submit", async ev => {
  if(ev.target.id !== "fLogin") return;
  ev.preventDefault(); ev.stopImmediatePropagation();
  $("#lmsg").textContent = "Signing in…";
  try{ await FT.signIn($("#lid").value, $("#lpw").value); location.reload(); }
  catch(e){ $("#lmsg").textContent = FT.friendlyError(e); }
}, true);
document.addEventListener("click", async ev => {
  const t = ev.target;
  if(t.id === "gsign"){ $("#lmsg").textContent = "Opening Google…"; try{ await FT.signInAdmin(); location.reload(); }catch(e){ $("#lmsg").textContent = FT.friendlyError(e); } }
  if(t.id === "signout"){ await FT.auth.signOut(); location.reload(); }
}, true);

boot();
